name: Fund facts from AMC monthly disclosures

on:
  # Schedule switched off: edelweissmf.com answers GitHub's servers with
  # "403 Access Denied", so a scheduled run cannot reach the page. Manual
  # runs stay available for testing.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install headless browser and Excel reader
        run: |
          pip install --quiet playwright openpyxl
          python -m playwright install --with-deps chromium

      - name: Altiva SIF (Edelweiss)
        continue-on-error: true
        run: python3 scripts/fetch_altiva.py

      - name: Commit facts if changed
        run: |
          git config user.name "sif-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f site/facts.json ] && git add site/facts.json || true
          git diff --staged --quiet || git commit -m "Fund facts update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
