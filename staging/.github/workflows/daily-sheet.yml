name: Daily SIF sheet (image and captions)

on:
  schedule:
    # Hourly from 17:30 to 03:30 UTC. AMFI publishes SIF NAVs late evening IST; the sheet is built ONLY when
    # every fund has the same latest NAV date (see the gate in make_sheet.py), then once per date.
    - cron: '30 17-23 * * *'
    - cron: '30 0-3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-sheet
  cancel-in-progress: false

jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest NAV and rebuild data
        run: |
          python3 scripts/fetch_daily.py
          python3 scripts/build_site_data.py

      - name: Fetch benchmark indices (best-effort)
        continue-on-error: true
        run: python3 scripts/fetch_indices.py

      - name: Completeness gate (all funds must have the latest NAV)
        id: gate
        run: python3 tools/daily_sheet/make_sheet.py --check

      - name: Install fonts and browser
        if: steps.gate.outputs.ready == 'true'
        run: |
          (cd tools/daily_sheet && npm install --no-audit --no-fund)
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Build sheet and captions
        if: steps.gate.outputs.ready == 'true'
        run: python3 tools/daily_sheet/make_sheet.py

      - name: Commit (sheet files only; NAV data is committed by the daily fetch job)
        run: |
          git config user.name "sif-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/daily
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily SIF sheet $(date -u +%Y-%m-%d)"
          # discard data files this job regenerated (the daily fetch job owns them) so the rebase is clean
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
